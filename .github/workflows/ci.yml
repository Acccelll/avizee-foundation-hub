name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [stage-14-1-content-completion]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      VITE_APP_ENV: test
      VITE_APP_VERSION: ci
      APP_PUBLIC_URL: http://localhost:8080
      QUOTATION_HASH_SALT: ci-only-quotation-hash-salt-0000000000000000
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      VITE_SUPABASE_PROJECT_ID: ci
      CONTENT_SCHEDULER_SECRET: ci-only-content-scheduler-secret-000000000000
      EMAIL_PROVIDER: log
      STORAGE_PROVIDER: local
      CAPTCHA_PROVIDER: "null"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo TypeScript alterado."
            exit 0
          fi
          printf 'Lint: %s\n' "${files[@]}"
          bunx eslint --rule 'prettier/prettier: off' "${files[@]}"

      - name: Prettier check changed files
        id: prettier
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.yml' '*.yaml' '*.json' '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo formatável alterado."
            exit 0
          fi
          bunx prettier --check "${files[@]}"

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Tests
        id: tests
        continue-on-error: true
        run: bun run test

      - name: Build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Functional gate
        if: always()
        shell: bash
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "prettier=${{ steps.prettier.outcome }} (informativo nesta etapa)"
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
