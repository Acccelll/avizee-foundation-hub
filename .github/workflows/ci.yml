name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [stage-14-1-content-completion]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: test
      VITE_APP_ENV: test
      VITE_APP_VERSION: ci
      APP_PUBLIC_URL: http://localhost:8080
      E2E_BASE_URL: http://localhost:8080
      QUOTATION_HASH_SALT: ci-only-quotation-hash-salt-0000000000000000
      CONTENT_SCHEDULER_SECRET: ci-only-content-scheduler-secret-000000000000
      EMAIL_PROVIDER: log
      STORAGE_PROVIDER: local
      CAPTCHA_PROVIDER: "null"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      VITE_SUPABASE_PROJECT_ID: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo TypeScript alterado."
            exit 0
          fi
          bunx eslint --rule 'prettier/prettier: off' "${files[@]}"

      - name: Prettier check changed files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.yml' '*.yaml' '*.json' '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo formatável alterado."
            exit 0
          fi
          bunx prettier --check "${files[@]}"

      - name: Typecheck
        run: bun run typecheck

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          : "${API_URL:?API_URL ausente no supabase status}"
          : "${ANON_KEY:?ANON_KEY ausente no supabase status}"
          : "${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY ausente no supabase status}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local"
          } >> "$GITHUB_ENV"

      - name: Build
        run: bun run build

      - name: Start application preview
        shell: bash
        run: |
          nohup bunx vite preview --host 127.0.0.1 --port 8080 > /tmp/avizee-preview.log 2>&1 &
          echo $! > /tmp/avizee-preview.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/public/health > /tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/avizee-preview.log
          exit 1

      - name: Tests
        run: bun run test

      - name: Cleanup local services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/avizee-preview.pid ]; then
            kill "$(cat /tmp/avizee-preview.pid)" 2>/dev/null || true
          fi
          supabase stop --no-backup 2>/dev/null || true
