name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - stage-14-1-content-completion
      - pre-stage-15-close-previous-stages

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: test
      VITE_APP_ENV: test
      VITE_APP_VERSION: ci
      APP_PUBLIC_URL: http://localhost:8080
      E2E_BASE_URL: http://localhost:8080
      QUOTATION_HASH_SALT: ci-only-quotation-hash-salt-0000000000000000
      CONTENT_SCHEDULER_SECRET: ci-only-content-scheduler-secret-000000000000
      RETENTION_WORKER_SECRET: ci-only-retention-worker-secret-0000000000000
      EMAIL_PROVIDER: log
      STORAGE_PROVIDER: local
      CAPTCHA_PROVIDER: "null"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      VITE_SUPABASE_PROJECT_ID: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo TypeScript alterado."
            exit 0
          fi
          bunx eslint --rule 'prettier/prettier: off' "${files[@]}"

      - name: Prettier check changed files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.yml' '*.yaml' '*.json' '*.md' | grep -v '^src/routeTree\.gen\.ts$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo formatável alterado."
            exit 0
          fi
          bunx prettier --check "${files[@]}"

      # O plugin file-based do TanStack Router regenera routeTree.gen.ts no build.
      # A compilação vem antes do tsc para que novas rotas sejam tipadas pelo artefato gerado.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          : "${API_URL:?API_URL ausente no supabase status}"
          : "${ANON_KEY:?ANON_KEY ausente no supabase status}"
          : "${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY ausente no supabase status}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local"
          } >> "$GITHUB_ENV"

      - name: Seed approved catalog fixture
        run: bun scripts/ops/canonical-import.ts ci-seed

      - name: Database logical restore rehearsal
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          if [ -z "$db_container" ]; then
            echo "Container PostgreSQL local do Supabase não encontrado."
            exit 1
          fi

          started_at="$(date +%s)"
          dump_path="/tmp/avizee-pre-stage-15-public.dump"
          restore_db="avizee_restore_rehearsal"

          docker exec "$db_container" pg_dump \
            -U postgres \
            -d postgres \
            -Fc \
            --schema=public \
            -f "$dump_path"

          docker exec "$db_container" psql \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS ${restore_db} WITH (FORCE);" \
            -c "CREATE DATABASE ${restore_db};"

          docker exec -i "$db_container" psql \
            -U postgres \
            -d "$restore_db" \
            -v ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS unaccent WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA extensions;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          SQL

          docker exec "$db_container" psql \
            -U postgres \
            -d postgres \
            -Atc "SELECT id FROM auth.users ORDER BY id" \
            | docker exec -i "$db_container" psql \
                -U postgres \
                -d "$restore_db" \
                -v ON_ERROR_STOP=1 \
                -c "COPY auth.users(id) FROM STDIN"

          docker exec "$db_container" pg_restore \
            -U postgres \
            -d "$restore_db" \
            --no-owner \
            --no-acl \
            --exit-on-error \
            "$dump_path"

          restored_tables="$(docker exec "$db_container" psql -U postgres -d "$restore_db" -Atc "select count(*) from information_schema.tables where table_schema = 'public';")"
          if [ "$restored_tables" -lt 20 ]; then
            echo "Restore incompleto: somente ${restored_tables} tabelas públicas encontradas."
            exit 1
          fi

          for table in product_families products quotations content_articles audit_logs; do
            source_count="$(docker exec "$db_container" psql -U postgres -d postgres -Atc "select count(*) from public.${table};")"
            restore_count="$(docker exec "$db_container" psql -U postgres -d "$restore_db" -Atc "select count(*) from public.${table};")"
            if [ "$source_count" != "$restore_count" ]; then
              echo "Contagem divergente após restore em ${table}: origem=${source_count}, restore=${restore_count}."
              exit 1
            fi
          done

          docker exec "$db_container" psql \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE ${restore_db} WITH (FORCE);"

          finished_at="$(date +%s)"
          elapsed="$((finished_at - started_at))"
          echo "Application-schema logical restore rehearsal: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          echo "Validação: schema public restaurado isoladamente e contagens críticas equivalentes." >> "$GITHUB_STEP_SUMMARY"

      - name: Start application test server
        shell: bash
        run: |
          nohup bunx vite dev --host 127.0.0.1 --port 8080 > /tmp/avizee-preview.log 2>&1 &
          echo $! > /tmp/avizee-preview.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/public/health > /tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/avizee-preview.log
          exit 1

      - name: Tests
        run: bun run test

      - name: Cleanup local services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/avizee-preview.pid ]; then
            kill "$(cat /tmp/avizee-preview.pid)" 2>/dev/null || true
          fi
          supabase stop --no-backup 2>/dev/null || true
