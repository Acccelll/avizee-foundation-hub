name: Dependency Refresh Temporary

on:
  push:
    branches:
      - fix/shadcn-config-schema-20260902

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/shadcn-config-schema-20260902
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh vulnerable transitive dependencies
        run: bun audit fix

      - name: Verify dependency audit
        run: bun audit

      - name: Commit refreshed lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/dependency-refresh-temp.yml
          git add bun.lock package.json .github/workflows/dependency-refresh-temp.yml
          git diff --cached --quiet && { echo "No dependency changes produced"; exit 1; }
          git commit -m "fix(deps): atualizar transitivos vulneráveis"
          git push origin HEAD:fix/shadcn-config-schema-20260902
