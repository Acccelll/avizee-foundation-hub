name: OWASP dependency apply

on:
  push:
    branches:
      - fix/owasp-security-hardening-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun audit fix
      - run: bun audit
      - name: Persist safe lock and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/owasp-dependency-apply.yml
          git rm .github/workflows/owasp-dependency-refresh.yml
          git commit -m "fix: aplicar lockfile sem vulnerabilidades conhecidas"
          git push origin HEAD:${GITHUB_REF_NAME}
