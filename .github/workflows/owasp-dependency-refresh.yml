name: OWASP dependency refresh

on:
  push:
    branches:
      - fix/owasp-security-hardening-20260901

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply audit fixes
        run: bun audit fix
      - name: Verify audit
        run: bun audit | tee audit-after.txt
      - name: Capture dependency diff
        run: git diff -- package.json bun.lock | tee dependency-diff.patch
      - uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-refresh
          path: |
            package.json
            bun.lock
            audit-after.txt
            dependency-diff.patch
          retention-days: 3
