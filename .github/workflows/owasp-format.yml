name: OWASP format regression

on:
  push:
    branches:
      - fix/owasp-security-hardening-20260901

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format OWASP regression
        run: bunx prettier --write tests/security/owasp-hardening.test.ts
      - name: Persist formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/security/owasp-hardening.test.ts
          git rm .github/workflows/owasp-format.yml
          git commit -m "test: formatar regressão OWASP"
          git push origin HEAD:${GITHUB_REF_NAME}
